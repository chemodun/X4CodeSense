name: Marketplace Identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-id:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show the Azure DevOps profile ID
        run: |
          ID="$(az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)"
          echo "Azure DevOps profile ID of the publishing identity: ${ID}"
          echo "Add \`${ID}\` to the X4DevTools publisher as a member with the Contributor role." >> "$GITHUB_STEP_SUMMARY"
