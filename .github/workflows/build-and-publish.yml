name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'x4codesense@') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      RELEASE_PLEASE_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package extension
        id: package
        working-directory: client
        run: |
          mkdir -p artifacts
          npx --yes @vscode/vsce package --no-dependencies --out ./artifacts
          PACKAGE_PATH="$(find ./artifacts -maxdepth 1 -name '*.vsix' -print -quit)"
          echo "package_path=client/${PACKAGE_PATH#./}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.package_path }}

      - name: Attach Extension .vsix to Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN != '' && env.RELEASE_PLEASE_TOKEN || github.token }}
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.package.outputs.package_path }}

      - name: VirusTotal scan
        if: ${{ github.event_name == 'release' && env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          update_release_body: true
          request_rate: 4
          vt_api_key: ${{ env.VT_API_KEY }}
          github_token: ${{ env.RELEASE_PLEASE_TOKEN != '' && env.RELEASE_PLEASE_TOKEN || github.token }}
          files: |
            .vsix$

  marketplace:
    needs: extension
    if: ${{ github.event_name == 'release' && vars.PUBLISH_TO_MARKETPLACE == 'true' }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4 publish --azure-credential --skip-duplicate --packagePath vsix/*.vsix

  npm-package:
    if: ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'x4-catalog@') || startsWith(github.event.release.tag_name, 'x4-script-core@') || startsWith(github.event.release.tag_name, 'x4-script-language-server@') || startsWith(github.event.release.tag_name, 'x4-script-check@')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "${TAG%%@*}" in
            x4-catalog) WORKSPACE=packages/catalog ;;
            x4-script-core) WORKSPACE=packages/core ;;
            x4-script-language-server) WORKSPACE=packages/server ;;
            x4-script-check) WORKSPACE=packages/cli ;;
            *) echo "::error::Unknown component in tag ${TAG}"; exit 1 ;;
          esac
          NAME="$(node -p "require('./${WORKSPACE}/package.json').name")"
          VERSION="$(node -p "require('./${WORKSPACE}/package.json').version")"
          if [ "${TAG}" != "${NAME}@v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match ${NAME} ${VERSION} in ${WORKSPACE}"
            exit 1
          fi
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME}")" = 404 ]; then
            echo "::warning::${NAME} is not on npm yet: its first version is published by hand"
            exit 0
          fi
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME}/${VERSION}")" = 200 ]; then
            echo "::notice::${NAME}@${VERSION} is on npm already"
            exit 0
          fi
          npm --version
          npm publish --workspace "${WORKSPACE}"
          echo "::notice::${NAME}@${VERSION} is published"
