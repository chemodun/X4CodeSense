<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17406a"/>
      <stop offset="1" stop-color="#061427"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.45" stop-color="#f4b93a"/>
      <stop offset="1" stop-color="#9a5f08"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#f4b93a"/>
      <stop offset="1" stop-color="#b87412"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge: a hexagon, as the other X4DevTools script tools -->
  <polygon points="3,64 33.5,11.2 94.5,11.2 125,64 94.5,116.8 33.5,116.8" fill="url(#bg)" stroke="#8fcaf0" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="9,64 36.5,16.4 91.5,16.4 119,64 91.5,111.6 36.5,111.6" fill="none" stroke="#2c6493" stroke-width="1"/>

  <!-- The scripts it reads -->
  <text x="64" y="27" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="bold" fill="#7fd6ff" filter="url(#glow)">&lt;mdscript&gt;</text>
  <text x="64" y="108.5" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#7fd6ff" filter="url(#glow)">&lt;aiscript&gt;</text>

  <!-- A large X -->
  <text x="64" y="66" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="42" font-weight="900" fill="url(#gold)" stroke="#3b2402" stroke-width="1" paint-order="stroke">X</text>

  <!-- A plug, raised at the X's top right: agents connect to the checks -->
  <g transform="translate(88 40) rotate(40)" filter="url(#glow)">
    <path d="M 0,7 C 0,13 -5,15 -5,20" fill="none" stroke="#7fd6ff" stroke-width="2" stroke-linecap="round"/>
    <rect x="-3.5" y="-15" width="2" height="6" rx="0.6" fill="#c9d6e3"/>
    <rect x="1.5" y="-15" width="2" height="6" rx="0.6" fill="#c9d6e3"/>
    <path d="M -6,-9 H 6 V -2 C 6,3 3,7 0,7 C -3,7 -6,3 -6,-2 Z" fill="url(#plug)" stroke="#7a5200" stroke-width="0.8"/>
    <path d="M 0,-21 V -18 M -7,-17 L -5.5,-15 M 7,-17 L 5.5,-15" stroke="#ffe680" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Name -->
  <text x="64" y="83" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" stroke="#08182c" stroke-width="1.2" paint-order="stroke">CodeSense</text>
  <text x="64" y="97" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2.5" fill="url(#gold)" stroke="#3b2402" stroke-width="0.8" paint-order="stroke">MCP</text>
</svg>
