<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17406a"/>
      <stop offset="1" stop-color="#061427"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.45" stop-color="#f4b93a"/>
      <stop offset="1" stop-color="#9a5f08"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.6" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f0a818"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Badge: a hexagon, as the other X4DevTools script tools -->
  <polygon points="3,64 33.5,11.2 94.5,11.2 125,64 94.5,116.8 33.5,116.8" fill="url(#bg)" stroke="#8fcaf0" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="9,64 36.5,16.4 91.5,16.4 119,64 91.5,111.6 36.5,111.6" fill="none" stroke="#2c6493" stroke-width="1"/>

  <!-- The scripts it reads -->
  <text x="64" y="27" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="bold" fill="#7fd6ff" filter="url(#glow)">&lt;mdscript&gt;</text>
  <text x="64" y="107" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#7fd6ff" filter="url(#glow)">&lt;aiscript&gt;</text>

  <!-- A large X -->
  <text x="64" y="72" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#gold)" stroke="#3b2402" stroke-width="1" paint-order="stroke">X</text>

  <!-- Light bulb, raised at the X's top right: completion, hover and quick fixes -->
  <g transform="translate(87 44) scale(0.85)" filter="url(#glow)">
    <path d="M -7,-1 A 8,8 0 1 1 7,-1 C 7,3 3,5 3,9 H -3 C -3,5 -7,3 -7,-1 Z" fill="url(#bulb)" stroke="#7a5200" stroke-width="0.8"/>
    <rect x="-3.5" y="10" width="7" height="2" rx="1" fill="#c9d6e3"/>
    <rect x="-3" y="13" width="6" height="2" rx="1" fill="#9fb2c6"/>
    <path d="M 0,-15 V -12 M -11,-8 L -9,-6 M 11,-8 L 9,-6 M -13,1 H -10 M 13,1 H 10" stroke="#ffe680" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Name -->
  <text x="64" y="90" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" stroke="#08182c" stroke-width="1.2" paint-order="stroke">CodeSense</text>
</svg>
